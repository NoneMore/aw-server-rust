name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-server:
    name: Windows server
    runs-on: windows-latest
    env:
      RELEASE_VERSION: v0.13.2

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: aw-webui/package-lock.json
    - name: Set up Rust
      id: toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-${{ steps.toolchain.outputs.cachekey }}-
    - name: Build aw-webui
      shell: bash
      working-directory: aw-webui
      run: |
        npm ci
        mkdir -p static
        cp media/logo/logo.png static/logo.png
        cp media/logo/logo.svg static/logo.svg
        npm run build
        test -f dist/index.html
    - name: Set aw-server-rust release version
      shell: pwsh
      run: |
        $manifest = "aw-server/Cargo.toml"
        $serverVersion = $env:RELEASE_VERSION.TrimStart("v")
        $lines = Get-Content -LiteralPath $manifest
        for ($i = 0; $i -lt $lines.Count; $i++) {
          if ($lines[$i] -match '^version = ') {
            $lines[$i] = "version = `"$serverVersion`""
            break
          }
        }
        Set-Content -LiteralPath $manifest -Value $lines
        Select-String -Path $manifest -Pattern '^version = '
    - name: Build installer-compatible aw-server-rust
      shell: pwsh
      run: |
        cargo build -p aw-server --release --bin aw-server --verbose
        $version = & .\target\release\aw-server.exe --version
        Write-Host $version
        $expectedVersion = "aw-server $($env:RELEASE_VERSION.TrimStart("v"))"
        if ($version -ne $expectedVersion) {
          throw "Unexpected aw-server version: $version"
        }
    - name: Test aw-datastore
      run: cargo test -p aw-datastore --verbose
    - name: Package replacement binary
      shell: bash
      run: |
        mkdir -p dist
        cp target/release/aw-server.exe dist/aw-server-rust.exe
        ls -lh dist/aw-server-rust.exe
    - name: Upload Windows server binary
      uses: actions/upload-artifact@v4
      with:
        name: binaries-Windows
        path: dist/aw-server-rust.exe
